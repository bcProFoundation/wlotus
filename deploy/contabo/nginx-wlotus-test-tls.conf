# Full TLS site for test.wlotus.org (recovery / post-Certbot reference).
#
#   sudo cp /etc/nginx/sites-available/wlotus-test /etc/nginx/sites-available/wlotus-test.bak
#   sudo cp deploy/contabo/nginx-wlotus-test-tls.conf /etc/nginx/sites-available/wlotus-test
#   # Adjust ssl paths if `sudo certbot certificates` shows a different live/ name
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -sS -A 'facebookexternalhit/1.1' \
#     'https://test.wlotus.org/<txid>?lang=vi' | grep og:title
#
# Share URLs always hit dana-index OG (altar preview). Restart dana-index after deploy.

server {
    listen 80;
    listen [::]:80;
    server_name test.wlotus.org;
    return 301 https://test.wlotus.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.wlotus.org;

    ssl_certificate     /etc/letsencrypt/live/test.wlotus.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.wlotus.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/wlotus-test;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location /index-api/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
    }

    location ~* "^/og/([0-9a-fA-F]{64})/?$" {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    location ~* "^/([0-9a-fA-F]{64})/?$" {
        error_page 502 503 504 = @wlotus_spa;
        proxy_pass http://127.0.0.1:8788/og/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    location @wlotus_spa {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA service worker + manifest must never be served from a stale HTTP
    # cache — WebKit/Safari (iOS) does not reliably bypass the disk cache
    # on registration.update() the way Chrome does, so a long/absent
    # Cache-Control here can pin an iPhone on an old JS/CSS bundle for a
    # very long time even though every deploy replaces the files.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
