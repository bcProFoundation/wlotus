# Full TLS site for wlotus.org (recovery / post-Certbot reference).
#
# Use when HTTPS apex redirects to itself (301 loop) after a bootstrap overwrite,
# or when you need a known-good apex + www config with Let's Encrypt paths.
#
#   sudo cp /etc/nginx/sites-available/wlotus /etc/nginx/sites-available/wlotus.bak
#   sudo cp deploy/contabo/nginx-wlotus-prod-tls.conf /etc/nginx/sites-available/wlotus
#   # Adjust ssl paths if `sudo certbot certificates` shows a different live/ name
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -sI https://wlotus.org/ | head -5          # expect 200
#   curl -sI https://www.wlotus.org/ | head -5      # expect 301 → https://wlotus.org/
#
# Do NOT re-run bootstrap-prod.sh over this file (bootstrap skips TLS sites).

# HTTP → HTTPS apex (both names)
server {
    listen 80;
    listen [::]:80;
    server_name wlotus.org www.wlotus.org;
    return 301 https://wlotus.org$request_uri;
}

# HTTPS www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wlotus.org;

    ssl_certificate     /etc/letsencrypt/live/wlotus.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wlotus.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://wlotus.org$request_uri;
}

# HTTPS apex — SPA + mint-api + dana-index OG
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wlotus.org;

    ssl_certificate     /etc/letsencrypt/live/wlotus.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wlotus.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/wlotus;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # Public DANA memorial index (Chronik-backed history + OG previews).
    location /index-api/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
    }

    location ~* "^/og/([0-9a-fA-F]{64})/?$" {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    # Share URL → always OG HTML (altar name). Browsers boot SPA via JS.
    location ~* "^/([0-9a-fA-F]{64})/?$" {
        error_page 502 503 504 = @wlotus_spa;
        proxy_pass http://127.0.0.1:8788/og/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    location @wlotus_spa {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA service worker + manifest must never be served from a stale HTTP
    # cache — WebKit/Safari (iOS) does not reliably bypass the disk cache
    # on registration.update() the way Chrome does, so a long/absent
    # Cache-Control here can pin an iPhone on an old JS/CSS bundle for a
    # very long time even though every deploy replaces the files.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # TWA (Android) + Capacitor (iOS) deep-link verification files — see
    # apps/twa/README.md and apps/mobile/README.md. Served straight from
    # apps/web/public/.well-known/ via the SPA static root; default_type
    # forces application/json since stock nginx mime.types doesn't map
    # .json and has no mapping at all for the extension-less AASA file.
    location = /.well-known/assetlinks.json {
        default_type application/json;
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
