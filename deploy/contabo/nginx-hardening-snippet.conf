# Extra locations for the W Lotus HTTPS (or HTTP) server block.
# Installed to /etc/nginx/snippets/wlotus-hardening.conf by
# apply-nginx-hardening.sh (GitHub Actions). Requires the http-context zone in
# /etc/nginx/conf.d/wlotus-rate-limit.conf.
#
# Exact `location =` wins over prefix `location /api/` / `/index-api/`.

    location = /api/challenge {
        limit_req zone=wl_challenge burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location = /index-api/api/notify {
        default_type application/json;
        return 403 '{"ok":false,"error":"notify is not public"}';
    }
