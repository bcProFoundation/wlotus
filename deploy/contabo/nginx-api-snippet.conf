# Snippet — paste into BOTH HTTP and HTTPS server blocks for test.wlotus.org /
# wlotus.org. Prefer this over replacing the whole Certbot-managed site file.
#
# Share previews: every /<txid> is proxied to dana-index /og/<txid> (see also
# nginx-og-snippet.conf). Humans get the SPA via JS bootstrap in that HTML.

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # Public DANA memorial index (Chronik-backed history + OG previews).
    location /index-api/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
    }

    # Direct OG HTML (Facebook Sharing Debugger, curl checks).
    location ~* "^/og/([0-9a-fA-F]{64})/?$" {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    # Share URL → always OG (altar title). SPA boots in-browser from that HTML.
    location ~* "^/([0-9a-fA-F]{64})/?$" {
        error_page 502 503 504 = @wlotus_spa;
        rewrite ^/([0-9a-fA-F]{64})/?$ /og/$1$is_args$args break;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    location @wlotus_spa {
        try_files /index.html =404;
    }
