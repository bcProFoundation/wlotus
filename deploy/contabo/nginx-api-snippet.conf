# Snippet — paste into BOTH HTTP and HTTPS server blocks for test.wlotus.org.
# Prefer this over replacing the whole Certbot-managed site file.
#
# Also add the UA map once (http context / top of site file):
#   see deploy/contabo/nginx-og-snippet.conf

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # Public DANA memorial index (Chronik-backed history + OG previews).
    location /index-api/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
    }

    # Share URL: bots get OG HTML; humans get the SPA deeplink.
    location ~* "^/([0-9a-fA-F]{64})/?$" {
        error_page 418 = @wlotus_og;
        if ($wlotus_share_bot) { return 418; }
        try_files /index.html =404;
    }

    location @wlotus_og {
        rewrite ^/([0-9a-fA-F]{64})/?$ /og/$1$is_args$args break;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }
