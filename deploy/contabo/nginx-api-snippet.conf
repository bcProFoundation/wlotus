# Snippet — paste into BOTH HTTP and HTTPS server blocks for test.wlotus.org /
# wlotus.org. Prefer this over replacing the whole Certbot-managed site file.
#
# Share previews: every /<txid> is proxied to dana-index /og/<txid>.
# Prefer proxy_pass with an explicit /og/$1 path (do not rely on rewrite —
# unquoted {64} breaks nginx -t, and rewrite+break often leaves /<txid> as-is
# so dana-index returns JSON 404). Humans get the SPA via JS bootstrap in OG HTML.

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # Public DANA memorial index (Chronik-backed history + OG previews).
    location /index-api/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
    }

    # Direct OG HTML (Facebook Sharing Debugger, curl checks).
    location ~* "^/og/([0-9a-fA-F]{64})/?$" {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    # Share URL → dana-index OG. Explicit /og/$1 (no rewrite).
    location ~* "^/([0-9a-fA-F]{64})/?$" {
        error_page 502 503 504 = @wlotus_spa;
        proxy_pass http://127.0.0.1:8788/og/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    location @wlotus_spa {
        try_files /index.html =404;
    }
