# http-context zone for W Lotus challenge rate limits.
#
#   sudo cp deploy/contabo/nginx-rate-limit-zone.conf /etc/nginx/conf.d/wlotus-rate-limit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Site files use `limit_req zone=wl_challenge` on POST /api/challenge.
# 10 req/min per IP with burst=8 covers a household starting offerings
# together; a flood still hits 429 before mint-api walks Chronik.

limit_req_zone $binary_remote_addr zone=wl_challenge:10m rate=10r/m;
