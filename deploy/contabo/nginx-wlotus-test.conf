# Nginx site for WLotus offerings SPA (test).
#
# IMPORTANT: Do NOT blindly overwrite a Certbot-managed site with this file.
# If HTTPS already works, only merge the /api/ and /health location blocks
# into the existing server { } that listens on 443, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Fresh HTTP-only install:
#   sudo cp deploy/contabo/nginx-wlotus-test.conf /etc/nginx/sites-available/wlotus-test
#   sudo ln -sfn /etc/nginx/sites-available/wlotus-test /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then TLS:
#   sudo certbot --nginx -d test.wlotus.org
#
# Replace server_name if needed.

# Social crawlers → dana-index Open Graph HTML for /<burn-txid> share links.
map $http_user_agent $wlotus_share_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot|WhatsApp|SkypeUriPreview|Pinterest|redditbot|ZaloBot|Zalo|Line\/|Viber|Iframely|Embedly|Quora\ Link\ Preview|Snapchat|Applebot|bitlybot|Tumblr) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.wlotus.org;

    root /var/www/wlotus-test;
    index index.html;

    # Mint API (dual-mint Prayer offer) — run on localhost:8787
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location /index-api/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
    }

    location ~* "^/([0-9a-fA-F]{64})/?$" {
        error_page 418 = @wlotus_og;
        if ($wlotus_share_bot) { return 418; }
        try_files /index.html =404;
    }

    location @wlotus_og {
        rewrite ^/([0-9a-fA-F]{64})/?$ /og/$1$is_args$args break;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    # SPA: client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets; keep HTML fresh
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# After `certbot --nginx`, Certbot adds a second server { listen 443 ssl; ... }.
# Copy the same /api/ and /health locations into THAT block as well (or re-run
# certbot after this HTTP config is in place so it clones locations).
