# Nginx site for WLotus offerings SPA (test).
#
# IMPORTANT: Do NOT blindly overwrite a Certbot-managed site with this file.
# If HTTPS already works, only merge the location blocks from
# nginx-api-snippet.conf into the existing server { } that listens on 443, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Fresh HTTP-only install:
#   sudo cp deploy/contabo/nginx-wlotus-test.conf /etc/nginx/sites-available/wlotus-test
#   sudo ln -sfn /etc/nginx/sites-available/wlotus-test /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then TLS:
#   sudo certbot --nginx -d test.wlotus.org
# After Certbot, copy the same /api/, /index-api/, /og/, and /<txid> locations
# into the 443 server block (or use nginx-wlotus-test-tls.conf).
#
# Replace server_name if needed.

server {
    listen 80;
    listen [::]:80;
    server_name test.wlotus.org;

    root /var/www/wlotus-test;
    index index.html;

    # Mint API (dual-mint Prayer offer) — run on localhost:8787
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location /index-api/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
    }

    location ~* "^/og/([0-9a-fA-F]{64})/?$" {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    # Share URL → always OG HTML (altar name). Browsers boot SPA via JS.
    location ~* "^/([0-9a-fA-F]{64})/?$" {
        error_page 502 503 504 = @wlotus_spa;
        proxy_pass http://127.0.0.1:8788/og/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    location @wlotus_spa {
        try_files /index.html =404;
    }

    # SPA: client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets; keep HTML fresh
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
