# Open Graph / social crawler routing for dedication share URLs.
#
# Place the `map` once in http{} context (top of the site file is fine when
# included from sites-enabled). Paste the `location` into each HTTPS (and
# HTTP, if used) server block that serves the SPA.
#
# Humans still get the SPA. Crawlers get dana-index OG HTML with altar name.

map $http_user_agent $wlotus_share_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot|WhatsApp|SkypeUriPreview|Pinterest|redditbot|ZaloBot|Zalo|Line\/|Viber|Iframely|Embedly|Quora\ Link\ Preview|Snapchat|Applebot|bitlybot|Tumblr) 1;
}

