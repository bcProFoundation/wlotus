# Nginx site for WLotus offerings SPA (production).
#
# IMPORTANT: HTTP-only template for first bootstrap. Do NOT overwrite a live
# Certbot site with this file (bootstrap-prod.sh skips when TLS is present).
# If apex HTTPS 301-loops to itself, install nginx-wlotus-prod-tls.conf instead.
#
# Fresh HTTP-only install:
#   sudo cp deploy/contabo/nginx-wlotus-prod.conf /etc/nginx/sites-available/wlotus
#   sudo ln -sfn /etc/nginx/sites-available/wlotus /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then TLS (both names; cert covers redirect + apex):
#   sudo certbot --nginx -d wlotus.org -d www.wlotus.org
# Prefer nginx-wlotus-prod-tls.conf after that for a clean apex + www layout.
#
# DNS (required for www to reach this host before redirect):
#   A    @     → Contabo IPv4
#   A    www   → same IPv4   (or CNAME www → wlotus.org.)

# www → apex (HTTP). After certbot, ensure a matching 443 block also redirects.
server {
    listen 80;
    listen [::]:80;
    server_name www.wlotus.org;
    return 301 https://wlotus.org$request_uri;
}

# Apex — HTTP. Certbot will add listen 443 ssl and rewrite this to redirect
# HTTP→HTTPS; keep /api and SPA locations on the HTTPS apex server.
server {
    listen 80;
    listen [::]:80;
    server_name wlotus.org;

    root /var/www/wlotus;
    index index.html;

    # Mint API — run on localhost:8787
    location = /api/challenge {
        limit_req zone=wl_challenge burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location /api/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA service worker + manifest must never be served from a stale HTTP
    # cache — WebKit/Safari (iOS) does not reliably bypass the disk cache
    # on registration.update() the way Chrome does, so a long/absent
    # Cache-Control here can pin an iPhone on an old JS/CSS bundle for a
    # very long time even though every deploy replaces the files.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # TWA (Android) + Capacitor (iOS) deep-link verification files — see
    # apps/twa/README.md and apps/mobile/README.md.
    location = /.well-known/assetlinks.json {
        default_type application/json;
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# After certbot, you should also have (or add) HTTPS www → apex:
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name www.wlotus.org;
#     # ssl_certificate …  (same cert as apex if -d includes www)
#     return 301 https://wlotus.org$request_uri;
# }
