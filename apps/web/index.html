<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Gửi lời tưởng nhớ vĩnh hằng trên W Lotus." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="W Lotus" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="W Lotus" />
    <meta property="og:title" content="W Lotus - Đoá sen vĩnh hằng" />
    <meta property="og:description" content="Gửi lời tưởng nhớ vĩnh hằng trên W Lotus." />
    <meta property="og:image" content="/images/wlotus-icon-512.png" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="W Lotus - Đoá sen vĩnh hằng" />
    <meta name="twitter:description" content="Gửi lời tưởng nhớ vĩnh hằng trên W Lotus." />
    <meta name="twitter:image" content="/images/wlotus-icon-512.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/wlotus-icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/wlotus-icon-32.png" />
    <link rel="apple-touch-icon" href="/images/wlotus-icon-180.png" />
    <title>W Lotus</title>
    <script>
      (function () {
        try {
          var stored = (localStorage.getItem('wlotus.locale') || '').toLowerCase();
          var langs = navigator.languages || [navigator.language];
          var locale = stored;
          if (locale !== 'en' && locale !== 'vi' && locale !== 'zh') {
            locale = 'en';
            for (var i = 0; i < langs.length; i++) {
              var tag = String(langs[i] || '').toLowerCase();
              if (tag.indexOf('vi') === 0) { locale = 'vi'; break; }
              if (tag.indexOf('zh') === 0) { locale = 'zh'; break; }
              if (tag.indexOf('en') === 0) { locale = 'en'; break; }
            }
          }
          if (locale === 'vi' || locale === 'zh') {
            document.documentElement.setAttribute('data-theme', 'temple');
            document.documentElement.setAttribute('data-locale', locale);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
              meta.setAttribute('content', locale === 'zh' ? '#1c120c' : '#f3ebe0');
            }
          } else {
            document.documentElement.setAttribute('data-locale', 'en');
          }
        } catch (e) { /* keep dark */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
