<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Bông sen của sự tưởng nhớ." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="W Lotus" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="W Lotus" />
    <meta property="og:title" content="W Lotus - Kết nối các thế hệ" />
    <meta property="og:description" content="Bông sen của sự tưởng nhớ." />
    <meta property="og:image" content="/images/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="W Lotus — bông sen của sự tưởng nhớ" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="W Lotus - Kết nối các thế hệ" />
    <meta name="twitter:description" content="Bông sen của sự tưởng nhớ." />
    <meta name="twitter:image" content="/images/og.png" />
    <meta name="twitter:image:alt" content="W Lotus — bông sen của sự tưởng nhớ" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/wlotus-icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/wlotus-icon-32.png" />
    <link rel="apple-touch-icon" href="/images/wlotus-icon-180.png" />
    <title>W Lotus</title>
    <script>
      (function () {
        try {
          var stored = (localStorage.getItem('wlotus.locale') || '').toLowerCase();
          var langs = navigator.languages || [navigator.language];
          var locale = stored;
          if (locale !== 'en' && locale !== 'vi' && locale !== 'zh') {
            locale = 'en';
            for (var i = 0; i < langs.length; i++) {
              var tag = String(langs[i] || '').toLowerCase();
              if (tag.indexOf('vi') === 0) { locale = 'vi'; break; }
              if (tag.indexOf('zh') === 0) { locale = 'zh'; break; }
              if (tag.indexOf('en') === 0) { locale = 'en'; break; }
            }
          }
          var appearance = (localStorage.getItem('wlotus.appearance') || '').toLowerCase();
          if (appearance !== 'light' && appearance !== 'dark') {
            appearance = locale === 'vi' ? 'light' : 'dark';
          }
          var theme = appearance === 'light' ? 'light' : (locale === 'en' ? 'dark' : 'wood');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-locale', locale);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              theme === 'light' ? '#f3ebe0' : theme === 'wood' ? '#1c120c' : '#050505'
            );
          }
        } catch (e) { /* keep dark */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
