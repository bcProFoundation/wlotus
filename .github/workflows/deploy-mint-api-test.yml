# Update /opt/wlotus on the Contabo **test** VM and restart mint-api.
# Separate from Deploy web (test): SPA rsync does not restart the API.
#
# Required GitHub secrets (same as Deploy web (test)):
#   CONTABO_HOST
#   CONTABO_USER
#   CONTABO_SSH_PRIVATE_KEY
#
# Optional:
#   CONTABO_SSH_PORT     — default 22
#   CONTABO_REPO_PATH    — clone on VM; default /opt/wlotus
#
# Preserves live dryrun baton JSON + first-burn claims, then:
#   chown deploy → git fetch/reset → nginx hardening → npm ci → restart mint-api → wait /health
#
# One-time VM setup: deploy/contabo/README.md (install-wlotus-deploy-sudoers.sh)

name: Deploy mint-api (test)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'master SHA, or empty for this workflow ref (must be on master)'
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - 'apps/mint-api/**'
      - 'apps/dana-index/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/contabo/**'
      - '.github/workflows/deploy-mint-api-test.yml'

concurrency:
  group: deploy-mint-api-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy ref
        id: ref
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}

      - name: Ensure commit is on master
        run: |
          git fetch origin master
          SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::Deploy ref $SHA is not on origin/master. Run from master (or a SHA already merged)."
            exit 1
          fi
          echo "OK: $SHA is on master"

      - name: Require Contabo secrets
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in CONTABO_HOST CONTABO_USER CONTABO_SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_SSH_PORT: ${{ secrets.CONTABO_SSH_PORT }}
        run: |
          PORT="${CONTABO_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$CONTABO_HOST" >> ~/.ssh/known_hosts

      - name: Update mint-api checkout + restart
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_SSH_PORT: ${{ secrets.CONTABO_SSH_PORT }}
          CONTABO_REPO_PATH: ${{ secrets.CONTABO_REPO_PATH }}
        run: |
          PORT="${CONTABO_SSH_PORT:-22}"
          REPO="${CONTABO_REPO_PATH:-/opt/wlotus}"
          SHA="$(git rev-parse HEAD)"
          ssh -p "$PORT" "${CONTABO_USER}@${CONTABO_HOST}" \
            env REPO="$REPO" SHA="$SHA" \
            bash -s <<'REMOTE'
          set -euo pipefail
          : "${REPO:?REPO required}" "${SHA:?SHA required}"
          if [ ! -d "$REPO/.git" ]; then
            echo "::error::No git clone at $REPO — run bootstrap-opt-wlotus.sh first"
            exit 1
          fi
          cd "$REPO"
          ME="$(whoami)"
          sudo_n() {
            local bin="$1"; shift
            local base
            base="$(basename "$bin")"
            sudo -n "/usr/bin/$base" "$@" || sudo -n "/bin/$base" "$@" || sudo -n "$bin" "$@"
          }
          # .git/objects is often root-owned after bootstrap as root. Fetch must
          # run *after* chown or unpack-objects fails (exit 128).
          if [ "$REPO" = /opt/wlotus ]; then
            if sudo_n /bin/chown -R "$ME:$ME" /opt/wlotus; then
              echo "chown $ME:$ME /opt/wlotus OK"
            else
              echo "chown skipped (sudoers missing — install-wlotus-deploy-sudoers.sh)"
            fi
            if [ -d /opt/wlotus/node_modules ] && [ ! -w /opt/wlotus/node_modules ]; then
              sudo_n /bin/rm -rf /opt/wlotus/node_modules \
                && echo "removed root-owned /opt/wlotus/node_modules" \
                || true
            fi
          fi
          if [ ! -w "$REPO/.git/objects" ]; then
            echo "::error::$REPO/.git/objects is not writable by $ME (git fetch would fail)."
            echo "On the VM as root: sudo chown -R $ME:$ME $REPO"
            echo "Then: sudo bash $REPO/deploy/contabo/install-wlotus-deploy-sudoers.sh"
            exit 1
          fi
          BAK=/tmp/wlotus-deploy-bak
          mkdir -p "$BAK"
          for f in \
            deployments/mainnet-wlotus.json \
            deployments/mainnet-dryrun-active.json \
            deployments/mainnet-dryrun-wlotus.json \
            deployments/temple-special-claims.json; do
            [ -f "$f" ] && cp -a "$f" "$BAK/" || true
          done
          git fetch origin
          git reset --hard "$SHA"
          mkdir -p deployments
          for f in \
            mainnet-wlotus.json \
            mainnet-dryrun-active.json \
            mainnet-dryrun-wlotus.json \
            temple-special-claims.json; do
            if [ -f "$BAK/$f" ]; then
              cp -a "$BAK/$f" "deployments/$f"
              echo "restored deployments/$f"
            fi
          done
          if [ -d node_modules ] && [ ! -w node_modules ]; then
            echo "::error::$REPO/node_modules is not writable by $ME"
            echo "On the VM as root: sudo chown -R $ME:$ME $REPO"
            exit 1
          fi
          npm ci
          apply_nginx() {
            local script="$REPO/deploy/contabo/apply-nginx-hardening.sh"
            if [ ! -f "$script" ]; then
              echo "nginx apply script not in this SHA — skip"
              return 0
            fi
            if sudo -n /usr/bin/bash "$script" || sudo -n /bin/bash "$script"; then
              echo "nginx hardening applied"
              return 0
            fi
            echo "::warning::nginx hardening skipped (need sudoers). As root:"
            echo "  sudo bash $REPO/deploy/contabo/install-wlotus-deploy-sudoers.sh"
            echo "Then re-run Deploy mint-api (test)."
            return 0
          }
          apply_nginx
          restart_unit() {
            local unit="$1"
            local required="${2:-1}"
            if sudo -n /usr/bin/systemctl restart "$unit" \
               || sudo -n /bin/systemctl restart "$unit"; then
              echo "restarted $unit"
              return 0
            fi
            if [ "$required" = 1 ]; then
              echo "::error::sudo restart $unit failed (password required or sudoers path mismatch)."
              echo "Ubuntu usrmerge: sudo matches /usr/bin/systemctl, not only /bin/systemctl."
              echo "On the test VM as root, install passwordless sudo for $ME:"
              echo "  sudo bash /opt/wlotus/deploy/contabo/install-wlotus-deploy-sudoers.sh"
              echo "If that file is not on the VM yet, as root paste the visudo block in"
              echo "  deploy/contabo/README.md  (section Deploy mint-api (test))."
              echo "Then re-run Actions → Deploy mint-api (test)."
              exit 1
            fi
            echo "::warning::sudo restart $unit skipped (unit missing or sudoers path mismatch)"
            return 0
          }
          restart_unit wlotus-mint-api.service 1
          restart_unit wlotus-dana-index.service 0
          echo "mint-api at $(git rev-parse --short HEAD)"
          # Type=simple: systemctl restart returns when tsx is spawned, not when
          # :8787 is listening. curl --retry does not retry connection refused.
          echo "waiting for systemd active + http://127.0.0.1:8787/health"
          i=0
          while [ "$i" -lt 15 ]; do
            i=$((i + 1))
            systemctl is-active --quiet wlotus-mint-api.service && break
            sleep 1
          done
          if ! systemctl is-active --quiet wlotus-mint-api.service; then
            echo "::error::wlotus-mint-api.service is not active after restart"
            systemctl status wlotus-mint-api.service --no-pager -l || true
            exit 1
          fi
          i=0
          while [ "$i" -lt 45 ]; do
            i=$((i + 1))
            if curl -fsS --max-time 2 http://127.0.0.1:8787/health 2>/dev/null; then
              echo
              echo "health OK after ${i}s"
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "::error::mint-api did not listen on :8787 within 45s"
              systemctl status wlotus-mint-api.service --no-pager -l || true
              exit 1
            fi
            sleep 1
          done
          REMOTE
