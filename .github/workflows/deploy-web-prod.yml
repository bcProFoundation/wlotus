# Build apps/web and rsync to the Contabo **production** VM.
#
# Triggers when a version tag is pushed (and that commit is on master).
# Example:
#   git checkout master && git pull
#   git tag -a v1.0.0 -m "WLotus prod v1.0.0"
#   git push origin v1.0.0
#
# Required GitHub secrets (repo or Environment "production"):
#   CONTABO_PROD_HOST
#   CONTABO_PROD_USER
#   CONTABO_PROD_SSH_PRIVATE_KEY
#
# Optional:
#   CONTABO_PROD_SSH_PORT          — default 22
#   CONTABO_PROD_DEPLOY_PATH       — default /var/www/wlotus
#   CONTABO_PROD_REPO_PATH         — mint-api clone on VM; default /opt/wlotus
#   CONTABO_PROD_SMOKE_URL         — e.g. https://wlotus.org/
#   MINT_MNEMONIC_PROD             — synced to /etc/wlotus/mint.env on prod VM
#   DANAVERSE_WLOTUS_TOKEN         — PAT that can push to danaverse/wlotus (public snapshot)
#
# Build vars (prefer Environment "production" *variables*):
#   VITE_PRAYER_TOKEN_ID           — live WLOTUS token id
#   VITE_PRAYER_TICKER             — WLOTUS
#   VITE_CHRONIK_URLS
#   VITE_TIP_POLL_MS
#   VITE_MIN_PRAY_SECONDS           — soft pray floor in seconds (e.g. 108); 0=off
#
# One-time VM setup: deploy/contabo/README.md § Production

name: Deploy web (prod)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or SHA to deploy (e.g. v1.0.0). Empty = this workflow ref.'
        required: false
        type: string

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve deploy ref
        id: ref
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}

      - name: Ensure commit is on master
        run: |
          git fetch origin master
          SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::Deploy ref $SHA is not an ancestor of origin/master. Only tag/deploy commits that are on master."
            exit 1
          fi
          echo "OK: $SHA is on master"
          git describe --tags --exact-match HEAD 2>/dev/null || echo "(not an exact tag — workflow_dispatch SHA ok)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web
        env:
          VITE_PRAYER_TOKEN_ID: ${{ vars.VITE_PRAYER_TOKEN_ID || secrets.VITE_PRAYER_TOKEN_ID }}
          VITE_PRAYER_TICKER: ${{ vars.VITE_PRAYER_TICKER }}
          VITE_CHRONIK_URLS: ${{ vars.VITE_CHRONIK_URLS || secrets.VITE_CHRONIK_URLS }}
          VITE_TIP_POLL_MS: ${{ vars.VITE_TIP_POLL_MS || secrets.VITE_TIP_POLL_MS }}
          VITE_MIN_PRAY_SECONDS: ${{ vars.VITE_MIN_PRAY_SECONDS }}
          VITE_PUBLIC_SITE_ORIGIN: https://wlotus.org
        run: |
          echo "Building prod SPA (ticker var=${VITE_PRAYER_TICKER:-<app default>} minPraySeconds=${VITE_MIN_PRAY_SECONDS:-108})"
          npm run web:build

      - name: Require Contabo prod secrets
        env:
          CONTABO_PROD_HOST: ${{ secrets.CONTABO_PROD_HOST }}
          CONTABO_PROD_USER: ${{ secrets.CONTABO_PROD_USER }}
          CONTABO_PROD_SSH_PRIVATE_KEY: ${{ secrets.CONTABO_PROD_SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in CONTABO_PROD_HOST CONTABO_PROD_USER CONTABO_PROD_SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is not set (Environment: production)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTABO_PROD_SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        env:
          CONTABO_PROD_HOST: ${{ secrets.CONTABO_PROD_HOST }}
          CONTABO_PROD_SSH_PORT: ${{ secrets.CONTABO_PROD_SSH_PORT }}
        run: |
          PORT="${CONTABO_PROD_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$CONTABO_PROD_HOST" >> ~/.ssh/known_hosts

      - name: Rsync dist to Contabo prod
        env:
          CONTABO_PROD_HOST: ${{ secrets.CONTABO_PROD_HOST }}
          CONTABO_PROD_USER: ${{ secrets.CONTABO_PROD_USER }}
          CONTABO_PROD_SSH_PORT: ${{ secrets.CONTABO_PROD_SSH_PORT }}
          CONTABO_PROD_DEPLOY_PATH: ${{ secrets.CONTABO_PROD_DEPLOY_PATH }}
        run: |
          PORT="${CONTABO_PROD_SSH_PORT:-22}"
          DEST="${CONTABO_PROD_DEPLOY_PATH:-/var/www/wlotus}"
          rsync -avz --delete \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=yes" \
            apps/web/dist/ \
            "${CONTABO_PROD_USER}@${CONTABO_PROD_HOST}:${DEST}/"

      - name: Sync mint fee wallet env (optional)
        env:
          CONTABO_PROD_HOST: ${{ secrets.CONTABO_PROD_HOST }}
          CONTABO_PROD_USER: ${{ secrets.CONTABO_PROD_USER }}
          CONTABO_PROD_SSH_PORT: ${{ secrets.CONTABO_PROD_SSH_PORT }}
          MINT_MNEMONIC_PROD: ${{ secrets.MINT_MNEMONIC_PROD }}
        run: |
          if [ -z "$MINT_MNEMONIC_PROD" ]; then
            echo "MINT_MNEMONIC_PROD not set — leave /etc/wlotus/mint.env unchanged"
            exit 0
          fi
          PORT="${CONTABO_PROD_SSH_PORT:-22}"
          ssh -p "$PORT" "${CONTABO_PROD_USER}@${CONTABO_PROD_HOST}" \
            'sudo mkdir -p /etc/wlotus'
          printf 'MINT_MNEMONIC="%s"\nMINT_API_PORT=8787\n' "$MINT_MNEMONIC_PROD" | \
            ssh -p "$PORT" "${CONTABO_PROD_USER}@${CONTABO_PROD_HOST}" \
              'sudo tee /etc/wlotus/mint.env > /dev/null && sudo chmod 600 /etc/wlotus/mint.env'
          echo "Synced /etc/wlotus/mint.env on prod"

      - name: Update mint-api checkout + restart
        env:
          CONTABO_PROD_HOST: ${{ secrets.CONTABO_PROD_HOST }}
          CONTABO_PROD_USER: ${{ secrets.CONTABO_PROD_USER }}
          CONTABO_PROD_SSH_PORT: ${{ secrets.CONTABO_PROD_SSH_PORT }}
          CONTABO_PROD_REPO_PATH: ${{ secrets.CONTABO_PROD_REPO_PATH }}
        run: |
          PORT="${CONTABO_PROD_SSH_PORT:-22}"
          REPO="${CONTABO_PROD_REPO_PATH:-/opt/wlotus}"
          SHA="$(git rev-parse HEAD)"
          # Empty when workflow_dispatch on an untagged master SHA — must still be
          # passed to the remote. SSH drops trailing empty argv, so use env vars
          # (not bash -s -- … "$TAG") to avoid `set -u` → `$3: unbound variable`.
          TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          ssh -p "$PORT" "${CONTABO_PROD_USER}@${CONTABO_PROD_HOST}" \
            env REPO="$REPO" SHA="$SHA" TAG="$TAG" \
            bash -s <<'REMOTE'
          set -euo pipefail
          : "${REPO:?REPO required}" "${SHA:?SHA required}"
          TAG="${TAG-}"
          if [ ! -d "$REPO/.git" ]; then
            echo "No git clone at $REPO — skip mint-api update (bootstrap mint-api first)"
            exit 0
          fi
          cd "$REPO"
          ME="$(whoami)"
          sudo_n() {
            local bin="$1"; shift
            local base
            base="$(basename "$bin")"
            sudo -n "/usr/bin/$base" "$@" || sudo -n "/bin/$base" "$@" || sudo -n "$bin" "$@"
          }
          # Fetch must run after chown — .git/objects is often root-owned.
          if [ "$REPO" = /opt/wlotus ]; then
            if sudo_n /bin/chown -R "$ME:$ME" /opt/wlotus; then
              echo "chown $ME:$ME /opt/wlotus OK"
            else
              echo "chown skipped (sudoers missing or not /opt/wlotus owner fix)"
            fi
            if [ -d /opt/wlotus/node_modules ] && [ ! -w /opt/wlotus/node_modules ]; then
              sudo_n /bin/rm -rf /opt/wlotus/node_modules \
                && echo "removed root-owned /opt/wlotus/node_modules" \
                || true
            fi
          fi
          if [ ! -w "$REPO/.git/objects" ]; then
            echo "::error::$REPO/.git/objects is not writable by $ME (git fetch would fail)."
            echo "On the VM as root: sudo chown -R $ME:$ME $REPO"
            exit 1
          fi
          # Force-checkout must not replace the live felt JSON with git's
          # abandoned fcf7de59 copy (that desyncs mint-api from dana-index).
          BAK=/tmp/wlotus-deploy-bak
          mkdir -p "$BAK"
          for f in \
            deployments/mainnet-wlotus.json \
            deployments/mainnet-dryrun-wlotus.json \
            deployments/mainnet-dryrun-active.json \
            deployments/temple-special-claims.json; do
            [ -f "$f" ] && cp -a "$f" "$BAK/" || true
          done
          git fetch --tags origin
          if [ -n "$TAG" ]; then
            git checkout --force "tags/$TAG" || git checkout --force "$TAG"
          else
            git checkout --force "$SHA"
          fi
          mkdir -p deployments
          for f in \
            mainnet-wlotus.json \
            mainnet-dryrun-wlotus.json \
            mainnet-dryrun-active.json \
            temple-special-claims.json; do
            if [ -f "$BAK/$f" ]; then
              cp -a "$BAK/$f" "deployments/$f"
              echo "restored deployments/$f"
            fi
          done
          if [ -d node_modules ] && [ ! -w node_modules ]; then
            echo "::error::$REPO/node_modules is not writable by $ME (still root-owned?)."
            echo "On the VM as root run once:"
            echo "  sudo chown -R $ME:$ME $REPO"
            echo "Then refresh sudoers from master bootstrap-prod.sh and re-tag/redeploy."
            exit 1
          fi
          npm ci
          apply_nginx() {
            local script="$REPO/deploy/contabo/apply-nginx-hardening.sh"
            if [ ! -f "$script" ]; then
              echo "nginx apply script not in this SHA — skip"
              return 0
            fi
            if sudo -n /usr/bin/bash "$script" || sudo -n /bin/bash "$script"; then
              echo "nginx hardening applied"
              return 0
            fi
            echo "::warning::nginx hardening skipped (need sudoers). As root:"
            echo "  sudo bash $REPO/deploy/contabo/install-wlotus-deploy-sudoers.sh"
            return 0
          }
          apply_nginx
          # Prefer /usr/bin (Ubuntu usrmerge). Do not hide a password prompt as success.
          if sudo -n /usr/bin/systemctl try-restart wlotus-mint-api.service \
             || sudo -n /bin/systemctl try-restart wlotus-mint-api.service \
             || sudo -n /usr/bin/systemctl restart wlotus-mint-api.service \
             || sudo -n /bin/systemctl restart wlotus-mint-api.service; then
            echo "restarted wlotus-mint-api.service"
          else
            echo "::warning::sudo restart mint-api failed (password required?). As root: sudo bash /opt/wlotus/deploy/contabo/install-wlotus-deploy-sudoers.sh"
          fi
          if sudo -n /usr/bin/systemctl try-restart wlotus-dana-index.service \
             || sudo -n /bin/systemctl try-restart wlotus-dana-index.service \
             || sudo -n /usr/bin/systemctl restart wlotus-dana-index.service \
             || sudo -n /bin/systemctl restart wlotus-dana-index.service; then
            echo "restarted wlotus-dana-index.service"
          else
            echo "::warning::sudo restart dana-index skipped"
          fi
          echo "mint-api at $(git rev-parse --short HEAD) tag=${TAG:-none}"
          REMOTE

      - name: Smoke check (optional HTTP)
        env:
          CONTABO_PROD_SMOKE_URL: ${{ secrets.CONTABO_PROD_SMOKE_URL }}
        run: |
          URL="${CONTABO_PROD_SMOKE_URL:-}"
          if [ -z "$URL" ]; then
            echo "CONTABO_PROD_SMOKE_URL not set — skip smoke check"
            exit 0
          fi
          curl -fsSL --retry 5 --retry-delay 2 "$URL" | head -c 200
          echo
          echo "Smoke OK: $URL"

      - name: Snapshot public danaverse/wlotus
        env:
          DANAVERSE_WLOTUS_TOKEN: ${{ secrets.DANAVERSE_WLOTUS_TOKEN }}
        run: |
          if [ -z "$DANAVERSE_WLOTUS_TOKEN" ]; then
            echo "::warning::DANAVERSE_WLOTUS_TOKEN not set — skip public snapshot"
            echo "Add a PAT with contents:write on danaverse/wlotus (Environment production)."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${DANAVERSE_WLOTUS_TOKEN}@github.com/danaverse/wlotus.git" \
            /tmp/danaverse-wlotus
          bash scripts/sync-danaverse-wlotus.sh /tmp/danaverse-wlotus
          cd /tmp/danaverse-wlotus
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "public snapshot already up to date"
            exit 0
          fi
          git commit -m "snapshot ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          git push origin HEAD:main
